<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palavras que Voam | Escolas e Praças</title>
  <link rel="stylesheet" href="../css/dashboard.css" />
  <script src="../js/sessao.js"></script>
</head>
<body onload="validarSessao(); listarEscolas(); listarPracas()">

  <div class="sidebar">
    <div class="logo">📚 Palavras<br><span>que</span> Voam</div>
    <div class="usuario-info">Olá, <strong id="b_usuario">usuário</strong>!</div>
    <hr class="nav-separador">
    <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
    <a href="livros.html"    class="nav-item">📖 Livros</a>
    <a href="clientes.html"  class="nav-item">👤 Clientes</a>
    <a href="locais.html"    class="nav-item ativo">🏫 Escolas e Praças</a>
    <a href="eventos.html"   class="nav-item">🎪 Eventos</a>
    <a href="vendas.html"    class="nav-item">💰 Vendas</a>
    <hr class="nav-separador">
    <button class="btn-sair" onclick="limparSessao()">🚪 Sair</button>
  </div>

  <div class="conteudo">
    <div class="page-header">
      <h2>🏫 Escolas e Praças</h2>
    </div>

    <!-- ── ESCOLAS ── -->
    <div class="card-painel">
      <h3 id="titulo_form_escola">🏫 Cadastrar Escola</h3>
      <input type="hidden" id="id_escola_editando" />
      <div class="form-grid">
        <div class="campo campo-full">
          <label>Nome da escola: *</label>
          <input id="escola_nome" type="text" placeholder="Ex: EMEF Maria Montessori" />
        </div>
        <div class="campo">
          <label>Cidade:</label>
          <input id="escola_cidade" type="text" placeholder="Ex: São Paulo" />
        </div>
        <div class="campo">
          <label>Estado:</label>
          <input id="escola_estado" type="text" placeholder="Ex: SP" maxlength="2" />
        </div>
      </div>
      <div class="form-acoes">
        <button class="btn-secundario" onclick="limparFormEscola()">Cancelar</button>
        <button class="btn-primario" onclick="salvarEscola()">💾 Salvar Escola</button>
      </div>
    </div>

    <div class="card-painel">
      <h3>📋 Escolas cadastradas</h3>
      <div class="tabela-wrapper">
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>Cidade</th><th>Estado</th><th>Ações</th></tr></thead>
          <tbody id="tabela_escolas">
            <tr><td colspan="5" style="text-align:center;padding:20px;color:#ccc;">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── PRAÇAS ── -->
    <div class="card-painel">
      <h3 id="titulo_form_praca">🌳 Cadastrar Praça / Local</h3>
      <input type="hidden" id="id_praca_editando" />
      <div class="form-grid">
        <div class="campo campo-full">
          <label>Nome da praça / local: *</label>
          <input id="praca_nome" type="text" placeholder="Ex: Praça da Sé" />
        </div>
        <div class="campo">
          <label>Cidade:</label>
          <input id="praca_cidade" type="text" placeholder="Ex: São Paulo" />
        </div>
        <div class="campo">
          <label>Estado:</label>
          <input id="praca_estado" type="text" placeholder="Ex: SP" maxlength="2" />
        </div>
      </div>
      <div class="form-acoes">
        <button class="btn-secundario" onclick="limparFormPraca()">Cancelar</button>
        <button class="btn-primario" onclick="salvarPraca()">💾 Salvar Praça</button>
      </div>
    </div>

    <div class="card-painel">
      <h3>📋 Praças cadastradas</h3>
      <div class="tabela-wrapper">
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>Cidade</th><th>Estado</th><th>Ações</th></tr></thead>
          <tbody id="tabela_pracas">
            <tr><td colspan="5" style="text-align:center;padding:20px;color:#ccc;">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>

<script>
  // ── Escolas ──
  function listarEscolas() {
    fetch("/escolas/listar")
      .then(r => r.status === 200 ? r.json() : [])
      .then(function (lista) {
        var tabela = document.getElementById("tabela_escolas");
        if (!lista || lista.length === 0) {
          tabela.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#ccc;">Nenhuma escola cadastrada.</td></tr>';
          return;
        }
        tabela.innerHTML = "";
        lista.forEach(function (e) {
          tabela.innerHTML += `<tr>
            <td>${e.id}</td><td><strong>${e.nome}</strong></td>
            <td>${e.cidade || "—"}</td><td>${e.estado || "—"}</td>
            <td class="acoes-td">
              <button class="btn-editar" onclick="editarEscola(${e.id},'${esc(e.nome)}','${esc(e.cidade||"")}','${esc(e.estado||"")}')">✏️ Editar</button>
              <button class="btn-perigo" onclick="deletarEscola(${e.id})">🗑️</button>
            </td></tr>`;
        });
      }).catch(console.log);
  }

  function salvarEscola() {
    var id     = document.getElementById("id_escola_editando").value;
    var nome   = document.getElementById("escola_nome").value;
    var cidade = document.getElementById("escola_cidade").value;
    var estado = document.getElementById("escola_estado").value;
    if (!nome) { toast("Nome é obrigatório!", "erro"); return; }
    var url = id ? `/escolas/editar/${id}` : "/escolas/cadastrar";
    fetch(url, { method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome, cidade, estado }) })
      .then(r => { if (r.ok) { toast(id ? "Escola atualizada!" : "Escola cadastrada!", "sucesso"); limparFormEscola(); listarEscolas(); } else toast("Erro ao salvar.", "erro"); })
      .catch(console.log);
  }

  function editarEscola(id, nome, cidade, estado) {
    document.getElementById("id_escola_editando").value = id;
    document.getElementById("escola_nome").value = nome;
    document.getElementById("escola_cidade").value = cidade;
    document.getElementById("escola_estado").value = estado;
    document.getElementById("titulo_form_escola").innerHTML = "✏️ Editando escola #" + id;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function deletarEscola(id) {
    if (!confirm("Excluir esta escola?")) return;
    fetch(`/escolas/deletar/${id}`, { method: "DELETE" })
      .then(r => { if (r.ok) { toast("Escola excluída!", "sucesso"); listarEscolas(); } else toast("Erro.", "erro"); }).catch(console.log);
  }

  function limparFormEscola() {
    ["id_escola_editando","escola_nome","escola_cidade","escola_estado"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("titulo_form_escola").innerHTML = "🏫 Cadastrar Escola";
  }

  // ── Praças ──
  function listarPracas() {
    fetch("/pracas/listar")
      .then(r => r.status === 200 ? r.json() : [])
      .then(function (lista) {
        var tabela = document.getElementById("tabela_pracas");
        if (!lista || lista.length === 0) {
          tabela.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#ccc;">Nenhuma praça cadastrada.</td></tr>';
          return;
        }
        tabela.innerHTML = "";
        lista.forEach(function (p) {
          tabela.innerHTML += `<tr>
            <td>${p.id}</td><td><strong>${p.nome}</strong></td>
            <td>${p.cidade || "—"}</td><td>${p.estado || "—"}</td>
            <td class="acoes-td">
              <button class="btn-editar" onclick="editarPraca(${p.id},'${esc(p.nome)}','${esc(p.cidade||"")}','${esc(p.estado||"")}')">✏️ Editar</button>
              <button class="btn-perigo" onclick="deletarPraca(${p.id})">🗑️</button>
            </td></tr>`;
        });
      }).catch(console.log);
  }

  function salvarPraca() {
    var id     = document.getElementById("id_praca_editando").value;
    var nome   = document.getElementById("praca_nome").value;
    var cidade = document.getElementById("praca_cidade").value;
    var estado = document.getElementById("praca_estado").value;
    if (!nome) { toast("Nome é obrigatório!", "erro"); return; }
    var url = id ? `/pracas/editar/${id}` : "/pracas/cadastrar";
    fetch(url, { method: id ? "PUT" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nome, cidade, estado }) })
      .then(r => { if (r.ok) { toast(id ? "Praça atualizada!" : "Praça cadastrada!", "sucesso"); limparFormPraca(); listarPracas(); } else toast("Erro ao salvar.", "erro"); })
      .catch(console.log);
  }

  function editarPraca(id, nome, cidade, estado) {
    document.getElementById("id_praca_editando").value = id;
    document.getElementById("praca_nome").value = nome;
    document.getElementById("praca_cidade").value = cidade;
    document.getElementById("praca_estado").value = estado;
    document.getElementById("titulo_form_praca").innerHTML = "✏️ Editando praça #" + id;
  }

  function deletarPraca(id) {
    if (!confirm("Excluir esta praça?")) return;
    fetch(`/pracas/deletar/${id}`, { method: "DELETE" })
      .then(r => { if (r.ok) { toast("Praça excluída!", "sucesso"); listarPracas(); } else toast("Erro.", "erro"); }).catch(console.log);
  }

  function limparFormPraca() {
    ["id_praca_editando","praca_nome","praca_cidade","praca_estado"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("titulo_form_praca").innerHTML = "🌳 Cadastrar Praça / Local";
  }

  function esc(s) { return String(s).replace(/'/g, "\\'"); }

  function toast(msg, tipo) {
    var t = document.getElementById("toast");
    t.innerHTML = msg;
    t.style.borderLeftColor = tipo === "sucesso" ? "#2e7d32" : "#e53935";
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 3500);
  }
</script>
