<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palavras que Voam | Login</title>
  <script src="./js/sessao.js"></script>
  <link rel="stylesheet" href="./css/estilo.css" />
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="container">
      <h1 class="titulo">Palavras <span>que</span> Voam</h1>
      <ul class="navbar">
        <li><a href="index.html">Início</a></li>
        <li class="separador">|</li>
        <li><a href="login.html">Login</a></li>
        <li><a href="cadastro.html" class="btn-nav-header">Cadastrar</a></li>
      </ul>
    </div>
  </div>

  <!-- TOAST -->
  <div class="alerta_erro">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <!-- FORMULÁRIO -->
  <div class="pagina-login">
    <div class="container">
      <div class="card-form">
        <h2>📚 Bem-vindo de volta!</h2>
        <p class="subtitulo">Acesse o sistema de gestão</p>

        <div class="formulario">
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="email" placeholder="seu@email.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="••••••" />
          </div>
          <button class="botao" onclick="entrar()">Entrar</button>
        </div>

        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" />
        </div>
        <div id="div_erros_login"></div>

        <p style="margin-top:16px; font-size:14px; color:#999;">
          Não tem conta? <a href="cadastro.html" style="color:#F7941D; font-weight:800;">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="container">
      <span>📚 Palavras que Voam &mdash; Sistema de Gestão</span>
      <span style="font-size:12px; opacity:0.8;">v1.0.0</span>
    </div>
  </div>

</body>
</html>

<script>
  function entrar() {
    aguardar();

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (emailVar == "" || senhaVar == "") {
      mostrarToast("Preencha todos os campos!", "erro");
      finalizarAguardar();
      return false;
    }

    fetch("/usuarios/autenticar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ emailServer: emailVar, senhaServer: senhaVar })
    })
    .then(function (resposta) {
      if (resposta.ok) {
        resposta.json().then(function (json) {
          sessionStorage.EMAIL_USUARIO = json.email;
          sessionStorage.NOME_USUARIO  = json.nome;
          sessionStorage.ID_USUARIO    = json.idUsuario;
          setTimeout(function () {
            window.location = "/dashboard/dashboard.html";
          }, 800);
        });
      } else {
        resposta.text().then(function (texto) {
          finalizarAguardar(texto);
          mostrarToast("Email e/ou senha inválidos!", "erro");
        });
      }
    })
    .catch(function (erro) {
      console.log(erro);
      finalizarAguardar("Erro de conexão com o servidor.");
    });

    return false;
  }
</script>
